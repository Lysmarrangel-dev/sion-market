<!doctype html>
<html lang="es-VE" class="pagina-acceso">
<head>
  <title>Iniciar sesión · Sionmarket</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FB6301">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Montserrat+Alternates:wght@600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/tema.js"></script>
  <script type="module" src="js/login.js"></script>
</head>
<body>
  <button class="btn-tema btn-tema-flotante" type="button" data-tema aria-label="Cambiar tema"></button>
  <div class="acceso">
    <main class="acceso-form">
      <a href="index.html" class="logo-link" aria-label="Sionmarket, volver al inicio">
        <img class="logo logo-claro" src="assets/logo-principal.webp" alt="Sionmarket" width="1200" height="526">
        <img class="logo logo-oscuro" src="assets/logo-negativo.webp" alt="" width="1200" height="526">
      </a>
      <div class="acceso-caja">
        <h1>Hola de nuevo</h1>
        <p class="subtitulo">Entra con tu correo para seguir donde quedaste.</p>
        <div class="aviso" id="aviso"></div>
          <div data-google hidden>
            <button class="btn btn-google btn-bloque" type="button" id="btn-google">
              <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
              Continuar con Google
            </button>
            <p class="separador">o con tu correo</p>
          </div>
        <form id="form-login" novalidate>
          <div class="campo">
            <label for="email">Correo</label>
            <input class="entrada" id="email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" required>
          </div>
          <div class="campo">
            <label for="clave">Contraseña</label>
            <div class="clave">
              <input class="entrada" id="clave" name="clave" type="password" autocomplete="current-password" required>
              <button type="button" class="ver-clave" data-ver-clave="clave" aria-pressed="false" aria-label="Mostrar contraseña">Mostrar</button>
            </div>
          </div>
          <div class="enlace-lateral"><a href="recuperar.html" id="enlace-recuperar">¿Olvidaste tu contraseña?</a></div>
          <button class="btn btn-primario btn-bloque" type="submit">Iniciar sesión</button>
        </form>
        <p class="acceso-pie">¿No tienes cuenta? <a href="registro.html">Crea una</a></p>
      </div>
      <p class="acceso-legal apoyo"><a href="legal.html#terminos">Términos</a> y <a href="legal.html#privacidad">Privacidad</a></p>
    </main>
    <aside class="acceso-marca" aria-hidden="true">
      <img class="isotipo-fondo" src="assets/isotipo-blanco.webp" alt="" width="419" height="709">
      <p class="frase">Lo que necesitas, a un toque.</p>
      <p class="apoyo">Compras, delivery y viajes en San Felipe, con una sola cuenta.</p>
    </aside>
  </div>
</body>
</html>
