# api.<dominio> → api (REST)   ·   api.<dominio>/ws → realtime (WebSockets)
# Certificados: certbot certonly --webroot -w /var/www/certbot -d api.sionmarket.com
upstream sm_api      { server api:3000;      keepalive 32; }
upstream sm_realtime { server realtime:3001; }

limit_req_zone $binary_remote_addr zone=sm_auth:10m rate=10r/m;

server {
  listen 80;
  server_name _;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name api.sionmarket.com;

  ssl_certificate     /etc/letsencrypt/live/api.sionmarket.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.sionmarket.com/privkey.pem;

  gzip on;
  gzip_types application/json;
  client_max_body_size 5m;

  # OTP requests are rate limited per IP on top of the per-phone limit in the API.
  location /v1/auth/ {
    limit_req zone=sm_auth burst=5 nodelay;
    proxy_pass http://sm_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /v1/ {
    proxy_pass http://sm_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws/ {
    proxy_pass http://sm_realtime;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }
}
