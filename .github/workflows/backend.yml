# Publica la imagen del backend en GitHub Packages cada vez que main cambia, y si el servidor
# está configurado (variable DEPLOY_HOST y secreto DEPLOY_SSH_KEY) la despliega ahí.
name: backend
on:
  push:
    branches: [main]
    paths: ['apps/backend/**', 'packages/**', 'pnpm-lock.yaml', 'infra/**', '.github/workflows/backend.yml']
  workflow_dispatch:

concurrency: { group: backend-deploy, cancel-in-progress: false }

jobs:
  imagen:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/lysmarrangel-dev/sionmarket-backend:latest
            ghcr.io/lysmarrangel-dev/sionmarket-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desplegar:
    needs: imagen
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: actions/checkout@v4
      - name: Copiar configuración y reiniciar en el servidor
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          API_DOMAIN: ${{ vars.API_DOMAIN || 'api.sionmarket.app' }}
        run: |
          install -m 600 /dev/null ~/.ssh_key && printf '%s\n' "$SSH_KEY" > ~/.ssh_key
          SSH="ssh -i ~/.ssh_key -o StrictHostKeyChecking=accept-new"
          rsync -az -e "$SSH" infra/nginx/ "$USER@$HOST:/opt/sionmarket/nginx/"
          rsync -az -e "$SSH" infra/docker-compose.prod.yml "$USER@$HOST:/opt/sionmarket/docker-compose.yml"
          $SSH "$USER@$HOST" 'cd /opt/sionmarket && docker compose pull && docker compose up -d --remove-orphans && docker compose exec -T nginx nginx -s reload && docker image prune -f'
          # Nginx resuelve api y realtime solo al arrancar o recargar: sin la recarga de arriba sigue
          # apuntando a los contenedores viejos y responde 502. Confirmamos que la API contesta.
          for i in $(seq 1 20); do curl -fsS -o /dev/null "https://${API_DOMAIN}/v1/salud" && exit 0; sleep 5; done
          echo "La API no responde en https://${API_DOMAIN}/v1/salud" >&2; exit 1
