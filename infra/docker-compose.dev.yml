# Base de datos y Redis para desarrollo local: pnpm db:up
services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: sionmarket
      POSTGRES_PASSWORD: sionmarket
      POSTGRES_DB: sionmarket
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sionmarket']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
volumes:
  pgdata:
