# Producción en una VPS Ubuntu. En el servidor: /opt/sionmarket/docker-compose.yml (copia de este archivo) y docker compose up -d
# Guía completa: docs/desplegar-backend.md
# La misma imagen corre los tres procesos del backend; Nginx termina HTTPS delante de api y realtime.
# La base de datos y el login son Supabase: DATABASE_URL, SUPABASE_URL van en .env (ver apps/backend/.env.example).
x-backend: &backend
  image: ${BACKEND_IMAGE:-ghcr.io/lysmarrangel-dev/sionmarket-backend:latest}
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    REDIS_URL: redis://redis:6379
  depends_on:
    redis: { condition: service_started }
    migrate: { condition: service_completed_successfully }

services:
  migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/lysmarrangel-dev/sionmarket-backend:latest}
    env_file: .env
    command: ['node', 'dist/db/migrate.js']

  api:
    <<: *backend
    command: ['node', 'dist/main-api.js']
    deploy: { replicas: 2 }

  realtime:
    <<: *backend
    command: ['node', 'dist/main-realtime.js']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/salud']
      interval: 15s

  worker:
    <<: *backend
    command: ['node', 'dist/main-worker.js']
    healthcheck: { disable: true }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redisdata:/data]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on: [api, realtime]

  # Renueva el certificado HTTPS; un cron del servidor recarga nginx después (ver la guía).
  certbot:
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    entrypoint: ['/bin/sh', '-c', 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done']
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot

volumes:
  redisdata:
