# Producción en una VPS Ubuntu: docker compose -f infra/docker-compose.prod.yml --env-file .env up -d
# La misma imagen corre los tres procesos del backend; Nginx termina HTTPS delante de api y realtime.
x-backend: &backend
  image: ${BACKEND_IMAGE:-ghcr.io/lysmarrangel-dev/sionmarket-backend:latest}
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://sionmarket:${POSTGRES_PASSWORD}@postgres:5432/sionmarket
    REDIS_URL: redis://redis:6379
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
    migrate: { condition: service_completed_successfully }

services:
  migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/lysmarrangel-dev/sionmarket-backend:latest}
    env_file: .env
    environment:
      DATABASE_URL: postgres://sionmarket:${POSTGRES_PASSWORD}@postgres:5432/sionmarket
    command: ['node', 'dist/db/migrate.js']
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *backend
    command: ['node', 'dist/main-api.js']
    deploy: { replicas: 2 }

  realtime:
    <<: *backend
    command: ['node', 'dist/main-realtime.js']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/salud']
      interval: 15s

  worker:
    <<: *backend
    command: ['node', 'dist/main-worker.js']
    healthcheck: { disable: true }

  postgres:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: sionmarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sionmarket
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sionmarket']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redisdata:/data]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    volumes:
      - ./nginx/sionmarket.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on: [api, realtime]

volumes:
  pgdata:
  redisdata:
